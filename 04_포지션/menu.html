<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {margin: 0;}
        .banner{
            height: 200px;
            background-color: tomato;
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 200px;
            font-weight: 900;
        }
        .menu {
            position: sticky;
            /* 스크롤 하더라도 고정하겠다 설정. */
            top: 0;
            /* 어느상황에서 고정할 건지
            위(top)와의 공간이 0이 되었을 때 */
            background-color: black;
            text-align: center;
            padding: 15px;
        }
        .menu a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        .content {
            height: 3000px;
            background-color: whitesmoke;
            padding: 20px;
        }
        .top-button {
            position: fixed;
            /* fixed(고정) */
            right: 20px;
            bottom: 20px;
            background-color: royalblue;
            color: white;
            padding: 15px;
            border-radius: 50%;
            text-decoration: none;
            /* text-decoration: 밑줄 / none: 없음 */
        }
        .card {
            position: relative;
            width: 200px;
            border: 1px solid gray;
        }
        .badge {
            top: 10px;
            right: 10px;
            background-color: tomato;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            position: absolute;
        }
        .card img {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="banner">SHOES MALL</div>
    <nav class="menu">
        <a href="#">신상품</a>
        <a href="#">운동화</a>
        <a href="#">구두</a>
        <a href="#">세일</a>
    </nav>
    <div class="card"><img src="./image/product1-1.jpg" alt="상품">
    <p>상품이름</p>
    <span class="badge">NEW</span>
    </div>
    <a href="#" class="top-button">TOP</a>
</body>
</html>
