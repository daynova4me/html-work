<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }
      /* div를 아무것도 안 하고 기본으로 두면 창과 입력값 사이에 8px 정도의 공백이 생기는데
        body {margin: number;}로 조정할 수 있음. */
      .outer {
        background-color: lightgray;
      }
      .box {
        width: 200px;
        /* width는 너비 */
        background-color: gold;
        border: 10px solid tomato;
        margin: 40px;
        /* 부모에 포함되어 있기 때문에 margin이 같이 적용됨. */
        text-align: center;
        /* 가운데 정렬 */
      }
      .content {
        color: white;
      }
      .a,
      .b {
        width: 200px;
        background-color: gold;
        border: 5px solid tomato;
        margin-bottom: 10px;
        padding: 20px;
        /* padding 안쪽에 있는 입력값과 박스의 거리 설정 */
      }
      .a {
        box-sizing: content-box;
        /* content가 기본값. */
        /* 전체 너비: 250
        200(width) + 20+5(padding + border) + 20+5(padding + border) = 250px */
        margin-bottom: 50px;
      }

      .b {
        box-sizing: border-box;
        /* content-box와 다르게 padding과 border의 크기를 포함하지 않음.(색은 포함)
        정확히 너비가 200(width) */
        margin-top: 20px;
        margin-left: 50px;
        margin-bottom: 50px;
        border-radius: 20%;
        /* %가 px보다 영역이 더 큼. */
        box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.3);
        /* 가로축(x)와 세로축(y)가 5px이고 12만큼의 흐림정도. */
      }
      /* 두 margin중에 더 큰 값을 이용함. */
      .x {
        background: gold;
        width: 200px;
        margin: 0 auto;
        /* 화면의 정가운데로 가는 것.(화면 조정되면 조정되는대로 그 크기의 가운데에 위치하게 됨.) */
        /* width 값을 가지고 있어야 실행 가능(width가 없으면 한 줄을 다 잡기 때문) */
      }
      .y {
        background-color: skyblue;
        margin: 0 auto;
        /* div 태그(일반적인 블럭) 요소를 정 가운데
        위치시키는 방법 : margin 0, auto */
      }
      .z {
        /* 인라인 요소를 블럭요소로 변경 */
        display: block;
        background: tomato;
        /* 인라인태그는 너비를 못 갖는다.
        대표적으로 img, span*/
        width: 200px;
        margin: 0 auto;
    }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="box">
        <span class="content"> 🎁 선물 </span>
      </div>
    </div>
    <!-- border-b0x 속성 : 테두리와 패딩의 영향을 받지 않고
     박스의 크기를 일정하게 만들기 위해 주는 속성 -->
    <div class="a">A 영역</div>
    <div class="b">B 영역</div>
    <!-- 가운데 정렬 -->
    <div class="x">X</div>
    <div class="y">Y</div>
    <spam class="z">Z</spam>
  </body>
</html>
